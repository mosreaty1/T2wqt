<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مواقيت الصلاة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #27ae60;
      --green-bg:   #eaf7ef;
      --green-text: #1e8449;
      --radius:     24px;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #b8ceb0;
      background-image:
        radial-gradient(ellipse at 15% 55%, rgba(160,200,140,.7) 0%, transparent 58%),
        radial-gradient(ellipse at 85% 15%, rgba(190,215,170,.5) 0%, transparent 55%);
    }

    .page-root { max-width: 440px; width: 100%; }

    /* ══════════════════════════════════
       CARD
    ══════════════════════════════════ */
    .card {
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.1);
      position: relative;
      background: #fff;
    }

    /* ══════════════════════════════════
       HERO – cross-fade image gallery
    ══════════════════════════════════ */
    .hero {
      position: relative;
      height: 280px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    .hero:active { cursor: grabbing; }
    @media (min-width: 900px) { .hero { height: 310px; } }

    /* Two stacked bg layers for cross-fade */
    .hero-bg {
      position: absolute; inset: 0;
      background: #1a2a1a center / cover no-repeat;
      opacity: 0;
      transition: opacity .65s ease;
    }
    .hero-bg.show { opacity: 1; }

    /* gradient overlay (always on top of bg layers) */
    .hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.06) 0%,
        rgba(0,0,0,.04) 40%,
        rgba(0,0,0,.62) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── top bar ── */
    .top-bar {
      position: absolute;
      top: 14px; right: 14px; left: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    /* Hijri date chip (dark glass) */
    .glass-chip {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,.38);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 5px 13px;
      color: rgba(255,255,255,.9);
      font-size: 11px; font-weight: 600;
      white-space: nowrap;
      border: none; font-family: 'Cairo', sans-serif;
      cursor: default;
    }

    button.glass-chip { cursor: pointer; transition: background .2s; }
    button.glass-chip:hover { background: rgba(0,0,0,.52); }

    /* ── gallery dots ── */
    .gallery-dots {
      position: absolute;
      top: 50px; left: 14px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .g-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      cursor: pointer;
      transition: background .2s, transform .2s;
      border: 1px solid rgba(255,255,255,.2);
    }
    .g-dot.active {
      background: #fff;
      transform: scale(1.25);
      box-shadow: 0 0 6px rgba(255,255,255,.6);
    }
    /* ── left/right arrows (desktop hover) ── */
    .hero-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      z-index: 3;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0; transition: opacity .2s;
    }
    .hero:hover .hero-arrow { opacity: 1; }
    .hero-arrow.prev { right: 14px; }
    .hero-arrow.next { left:  14px; }

    /* ── hero bottom split ── */
    .hero-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 20px;
      gap: 8px;
    }

    /* countdown (left) */
    .countdown-side { display: flex; flex-direction: column; align-items: flex-start; }
    .countdown-label {
      color: rgba(255,255,255,.82);
      font-size: 11px; font-weight: 600;
      letter-spacing: .5px; margin-bottom: 2px;
    }
    .countdown {
      color: #fff;
      font-size: clamp(24px, 7vw, 36px);
      font-weight: 900;
      direction: ltr;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px; line-height: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    /* prayer name + location (right) */
    .prayer-side { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .location-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
    .location-text {
      color: rgba(255,255,255,.88);
      font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 165px;
    }
    .location-text:hover { opacity: .7; }
    .loc-pin { color: rgba(255,255,255,.75); flex-shrink: 0; }

    .next-prayer-name {
      color: #fff;
      font-size: clamp(28px, 9vw, 46px);
      font-weight: 900; line-height: 1;
      text-shadow: 0 2px 14px rgba(0,0,0,.35);
    }

    /* ── bg label (image name) ── */
    .bg-label {
      position: absolute;
      bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 3;
      background: rgba(0,0,0,.32);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 3px 10px;
      color: rgba(255,255,255,.75);
      font-size: 10px; white-space: nowrap;
      pointer-events: none;
      opacity: 0; transition: opacity .4s;
    }
    .bg-label.show { opacity: 1; }

    /* ══════════════════════════════════
       PRAYER LIST
    ══════════════════════════════════ */
    .prayer-list {
      background: #fff;
      padding: 16px 14px 20px;
    }
    .prayers-row {
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      gap: 4px;
    }
    .prayer-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      padding: 10px 6px 12px;
      border-radius: 14px;
      transition: background .25s;
    }
    .prayer-col.active { background: var(--green-bg); }

    .p-name {
      font-size: 12px; color: #b0b8b4; font-weight: 700;
      white-space: nowrap;
    }
    .prayer-col.active .p-name { color: var(--green-text); }

    .p-time {
      font-size: clamp(13px, 3.5vw, 16px);
      font-weight: 700; color: #1c2a22;
      direction: ltr; white-space: nowrap;
    }
    .prayer-col.active .p-time { color: var(--green-text); }

    .p-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 1.8s ease-in-out infinite;
      display: none;
    }
    .prayer-col.active .p-dot { display: block; }

    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .3; transform: scale(1.7); }
    }

    /* ══════════════════════════════════
       OVERLAYS
    ══════════════════════════════════ */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(8,20,10,.88);
      backdrop-filter: blur(4px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 30;
      border-radius: var(--radius);
    }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { color: rgba(255,255,255,.78); font-size: 14px; }
    .retry-btn {
      background: var(--green); color: #fff; border: none;
      border-radius: 12px; padding: 10px 28px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 4px; transition: opacity .2s;
    }
    .retry-btn:hover { opacity: .85; }
    .hidden { display: none !important; }

    /* ══════════════════════════════════
       METHOD BOTTOM-SHEET
    ══════════════════════════════════ */

  </style>
</head>
<body>


<div class="page-root">

  <!-- ── Main card ── -->
  <div class="card" id="card">

    <!-- overlays -->
    <div class="overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span class="overlay-text" id="loadingText">جارِ تحديد موقعك…</span>
    </div>
    <div class="overlay hidden" id="errorOverlay">
      <span style="font-size:30px">⚠️</span>
      <span class="overlay-text" id="errorMsg">تعذّر تحميل مواقيت الصلاة</span>
      <button class="retry-btn" onclick="init()">إعادة المحاولة</button>
    </div>

    <!-- ── Hero ── -->
    <div class="hero" id="hero">
      <!-- cross-fade bg layers -->
      <div class="hero-bg" id="bgA"></div>
      <div class="hero-bg" id="bgB"></div>
      <!-- gradient overlay -->
      <div class="hero-grad"></div>

      <!-- top bar -->
      <div class="top-bar">
        <div class="glass-chip">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
          <span id="methodLabel">مصر – وزارة الأوقاف</span>
        </div>
        <div class="glass-chip" id="hijriDate">— هجري</div>
      </div>

      <!-- gallery dot nav (vertical, left side) -->
      <div class="gallery-dots" id="galleryDots"></div>

      <!-- arrows (desktop) -->
      <button class="hero-arrow prev" onclick="shiftBg(1)"  aria-label="next">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="hero-arrow next" onclick="shiftBg(-1)" aria-label="prev">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <!-- image name label -->
      <div class="bg-label" id="bgLabel"></div>

      <!-- bottom split -->
      <div class="hero-bottom">
        <div class="countdown-side">
          <span class="countdown-label">باقي على الأذان</span>
          <div class="countdown" id="countdown">00 : 00 : 00</div>
        </div>
        <div class="prayer-side">
          <div class="location-row">
            <span class="location-text" id="locationText" onclick="init()">جارِ التحديد…</span>
            <span class="loc-pin">
              <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
            </span>
          </div>
          <div class="next-prayer-name" id="nextPrayerName">—</div>
        </div>
      </div>
    </div><!-- /hero -->

    <!-- prayer list -->
    <div class="prayer-list">
      <div class="prayers-row" id="prayerCols"></div>
    </div>

  </div><!-- /card -->


</div><!-- /page-root -->

<script>
/* ═══════════════════════════════════════════════
   MOSQUE BACKGROUND GALLERY
   All images verified as real Islamic mosque
   exterior photos from Pexels (free license,
   HTTP 200 confirmed before deployment).
═══════════════════════════════════════════════ */
const MOSQUE_IMAGES = [
  {
    id:    '33687823',
    label: 'مسجد الشيخ زايد، أبوظبي',
    /* Sheikh Zayed Grand Mosque at Twilight Reflection – Lloyd Alozie */
  },
  {
    id:    '1631676',
    label: 'صلاة الغروب',
    /* Silhouette of Mosque during Sunset – Abdullah Ghatasheh */
  },
  {
    id:    '16737017',
    label: 'مساجد إسطنبول',
    /* Mosque Silhouette in Istanbul at Sunset – Kaan ALTUN */
  },
  {
    id:    '28669652',
    label: 'مسجد الحاكم، القاهرة',
    /* Stunning Evening View of Al-Hakim Mosque in Cairo – Mohamed samir */
  },
  {
    id:    '6099936',
    label: 'المسجد النبوي، المدينة المنورة',
    /* Al-Masjid an-Nabawi (Prophet's Mosque) courtyard – jepret hikmah */
  },
  {
    id:    '14440333',
    label: 'المسجد الحرام، مكة المكرمة',
    /* Landscape Photography of Masjid al-Haram – Talal Hakim */
  },
  {
    id:    '2344997',
    label: 'جامع دلهي عند الغروب',
    /* View of Jama Masjid at Sunset, New Delhi – Fuzail Ahmad */
  },
  {
    id:    '7805386',
    label: 'أفق إسطنبول',
    /* Mosque Silhouette at Sunset, Istanbul skyline */
  },
];

function bgUrl(id) {
  return `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=900&h=580&dpr=1`;
}

/* active bg layer & index */
let bgIdx   = 0;
let bgLayer = 'A';          // 'A' or 'B'
const bgA   = document.getElementById('bgA');
const bgB   = document.getElementById('bgB');
let   bgLabelTimer = null;

/* Preload an image then cross-fade */
function setBg(idx, showLabel = false) {
  bgIdx = ((idx % MOSQUE_IMAGES.length) + MOSQUE_IMAGES.length) % MOSQUE_IMAGES.length;
  const url  = bgUrl(MOSQUE_IMAGES[bgIdx].id);
  const next = bgLayer === 'A' ? bgB : bgA;
  const curr = bgLayer === 'A' ? bgA : bgB;

  const img = new Image();
  img.onload = () => {
    next.style.backgroundImage = `url(${url})`;
    next.classList.add('show');
    curr.classList.remove('show');
    bgLayer = bgLayer === 'A' ? 'B' : 'A';
    renderDots();

    if (showLabel) {
      const lbl = document.getElementById('bgLabel');
      lbl.textContent = MOSQUE_IMAGES[bgIdx].label;
      lbl.classList.add('show');
      clearTimeout(bgLabelTimer);
      bgLabelTimer = setTimeout(() => lbl.classList.remove('show'), 2000);
    }
  };
  img.onerror = () => {
    /* skip broken image silently */
    shiftBg(1, showLabel);
  };
  img.src = url;
}

function shiftBg(dir = 1, showLabel = true) {
  setBg(bgIdx + dir, showLabel);
}

function renderDots() {
  const container = document.getElementById('galleryDots');
  container.innerHTML = '';
  MOSQUE_IMAGES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'g-dot' + (i === bgIdx ? ' active' : '');
    d.onclick = () => setBg(i, true);
    container.appendChild(d);
  });
}

/* Touch swipe on hero */
let swipeX = 0;
const hero = document.getElementById('hero');
hero.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive: true });
hero.addEventListener('touchend',   e => {
  const dx = swipeX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 45) shiftBg(dx > 0 ? 1 : -1, true);
}, { passive: true });

/* Auto-advance every 12 s */
setInterval(() => shiftBg(1, false), 12000);

/* Init gallery */
renderDots();
setBg(0, false);   /* load first image */

/* ═══════════════════════════════════════════════
   PRAYER TIMES DATA
═══════════════════════════════════════════════ */
const PRAYERS = [
  { key: 'Fajr',    name: 'الفجر'  },
  { key: 'Dhuhr',   name: 'الظهر'  },
  { key: 'Asr',     name: 'العصر'  },
  { key: 'Maghrib', name: 'المغرب' },
  { key: 'Isha',    name: 'العشاء' },
];
const METHODS = [
  { id: 5, label: 'مصر – وزارة الأوقاف', short: 'مصر – وزارة الأوقاف' },
];

let timings  = null;
let timerIds = [];
let method   = 5;
let coords   = null;

init();

async function init() {
  setLoading('جارِ تحديد موقعك…');
  clearTimers();
  try {
    coords = await getCoords();
    await loadTimes(coords.lat, coords.lon, method);
    loadCity(coords.lat, coords.lon);   // non-blocking
  } catch (e) {
    setError(e.message || 'حدث خطأ غير متوقع');
  }
}

/* ── Geolocation ── */
function getCoords() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ lat: 21.3891, lon: 39.8579 }); return; }
    navigator.geolocation.getCurrentPosition(
      p  => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve({ lat: 21.3891, lon: 39.8579 }),
      { timeout: 9000 }
    );
  });
}

/* ── Aladhan API ── */
async function loadTimes(lat, lon, mth) {
  const d    = new Date();
  const date = `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
  const res  = await fetch(
    `https://api.aladhan.com/v1/timings/${date}?latitude=${lat}&longitude=${lon}&method=${mth}`
  );
  if (!res.ok) throw new Error('فشل الاتصال بخادم المواقيت');
  const json = await res.json();
  if (json.code !== 200) throw new Error('استجابة غير متوقعة من الخادم');

  timings = json.data.timings;
  const h = json.data.date.hijri;
  $('hijriDate').textContent = `${h.day} ${h.month.ar} ${h.year}`;

  render();
  hideOverlays();
  startTick();
}

/* ── Nominatim ── */
async function loadCity(lat, lon) {
  try {
    const res  = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
      { headers: { 'Accept-Language': 'ar' } }
    );
    const json = await res.json();
    const a    = json.address || {};
    const city = a.city || a.town || a.village || a.county || '';
    $('locationText').textContent = city
      ? `${city}، ${a.country || ''}`
      : (a.country || 'موقعك الحالي');
  } catch {
    $('locationText').textContent = 'موقعك الحالي';
  }
}

/* ── Render ── */
function render() {
  const curKey = currentKey();
  const nextP  = nextPrayer();

  /* columns */
  const cols = $('prayerCols');
  cols.innerHTML = '';
  PRAYERS.forEach(p => {
    const active = p.key === curKey;
    const col    = document.createElement('div');
    col.className = 'prayer-col' + (active ? ' active' : '');
    col.innerHTML = `
      <span class="p-name">${p.name}</span>
      <span class="p-time">${fmt(timings[p.key])}</span>
      <div class="p-dot"></div>`;
    cols.appendChild(col);
  });

  /* hero next prayer */
  $('nextPrayerName').textContent = nextP ? nextP.name : PRAYERS[0].name;

}

/* ── Countdown ── */
function startTick() { tick(); timerIds.push(setInterval(tick, 1000)); }

function tick() {
  const next = nextPrayer();
  if (!next) return;
  const diff = Math.max(0, Math.floor((prayerDate(next.key) - Date.now()) / 1000));
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  const str = `${pad(h)} : ${pad(m)} : ${pad(s)}`;
  $('countdown').textContent = str;
  if (s === 0 && m === 0) render();
}


/* ── Helpers ── */
function nextPrayer() {
  const now = Date.now();
  for (const p of PRAYERS) { if (prayerDate(p.key) > now) return p; }
  return PRAYERS[0];
}
function currentKey() {
  const now  = Date.now();
  let   last = PRAYERS[PRAYERS.length - 1];
  for (let i = PRAYERS.length - 1; i >= 0; i--) {
    if (prayerDate(PRAYERS[i].key) <= now) { last = PRAYERS[i]; break; }
  }
  return last.key;
}
function prayerDate(key) {
  if (!timings?.[key]) return new Date(0);
  const [h, m] = timings[key].split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0); return d;
}
function fmt(raw) {
  if (!raw || raw === '—') return '—';
  const p = raw.split(':');
  if (p.length < 2) return raw;
  const h = parseInt(p[0], 10);
  return `${pad(h % 12 || 12)}:${p[1]} ${h < 12 ? 'ص' : 'م'}`;
}
function pad(n)  { return String(n).padStart(2, '0'); }
function clearTimers() { timerIds.forEach(clearInterval); timerIds = []; }
function $(id)   { return document.getElementById(id); }

function setLoading(msg) {
  $('loadingText').textContent = msg;
  $('loadingOverlay').classList.remove('hidden');
  $('errorOverlay').classList.add('hidden');
}
function setError(msg) {
  $('errorMsg').textContent = msg;
  $('errorOverlay').classList.remove('hidden');
  $('loadingOverlay').classList.add('hidden');
}
function hideOverlays() {
  $('loadingOverlay').classList.add('hidden');
  $('errorOverlay').classList.add('hidden');
}
</script>
</body>
</html>
