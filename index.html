<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مواقيت الصلاة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #27ae60;
      --green-bg:    #eaf7ef;
      --green-text:  #1e8449;
      --card-radius: 24px;
    }

    /* ── Page ── */
    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #c8d8c0;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(180,210,160,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(200,220,180,0.5) 0%, transparent 55%);
    }

    /* ── Desktop layout ── */
    @media (min-width: 900px) {
      body { align-items: flex-start; padding: 40px 20px; }
      .page-root {
        display: grid;
        grid-template-columns: 440px 1fr;
        gap: 32px;
        width: 100%;
        max-width: 940px;
        align-items: start;
      }
      .sidebar { display: flex; flex-direction: column; gap: 20px; }
    }
    @media (max-width: 899px) {
      .sidebar { display: none; }
      .page-root { max-width: 440px; width: 100%; }
    }

    /* ── Card ── */
    .card {
      width: 100%;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.1);
      position: relative;
      background: #fff;
    }

    /* ══════════════════════════════════
       HERO
    ══════════════════════════════════ */
    .hero {
      position: relative;
      height: 280px;
      background: url('https://images.unsplash.com/photo-1564769662533-4f00a87b4056?w=900&q=85')
                  center / cover no-repeat;
    }
    @media (min-width: 900px) { .hero { height: 310px; } }

    /* gradient: transparent top → dark bottom-third */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.08) 0%,
        rgba(0,0,0,0.05) 40%,
        rgba(0,0,0,0.62) 100%
      );
    }

    /* top bar */
    .top-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      left: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hijri-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.38);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 5px 12px;
      color: rgba(255,255,255,0.92);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .hijri-chip svg { opacity: .75; }

    .method-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.38);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 5px 12px;
      color: rgba(255,255,255,0.88);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: 'Cairo', sans-serif;
      transition: background .2s;
      white-space: nowrap;
    }
    .method-btn:hover { background: rgba(0,0,0,0.52); }

    /* hero bottom: countdown LEFT · prayer+location RIGHT */
    .hero-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 20px;
      gap: 8px;
    }

    /* ─ LEFT: countdown ─ */
    .countdown-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .countdown-label {
      color: rgba(255,255,255,0.82);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      margin-bottom: 2px;
    }
    .countdown {
      color: #fff;
      font-size: clamp(24px, 7vw, 36px);
      font-weight: 900;
      direction: ltr;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    /* ─ RIGHT: prayer name + location ─ */
    .prayer-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }
    .location-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 3px;
    }
    .location-text {
      color: rgba(255,255,255,0.88);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
    .location-text:hover { opacity: .75; }
    .loc-pin { color: rgba(255,255,255,0.75); flex-shrink: 0; }

    .next-prayer-name {
      color: #fff;
      font-size: clamp(28px, 9vw, 46px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 14px rgba(0,0,0,0.35);
    }

    /* ══════════════════════════════════
       PRAYER LIST (white bottom)
    ══════════════════════════════════ */
    .prayer-list {
      background: #fff;
      padding: 16px 14px 20px;
    }

    .prayers-row {
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      gap: 4px;
    }

    .prayer-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px 12px;
      border-radius: 14px;
      cursor: default;
      transition: background .25s;
      min-width: 0;
    }
    .prayer-col.active {
      background: var(--green-bg);
    }

    .p-name {
      font-size: 12px;
      color: #b0b8b4;
      font-weight: 700;
      white-space: nowrap;
    }
    .prayer-col.active .p-name { color: var(--green-text); }

    .p-time {
      font-size: clamp(13px, 3.5vw, 16px);
      font-weight: 700;
      color: #1c2a22;
      direction: ltr;
      white-space: nowrap;
    }
    .prayer-col.active .p-time { color: var(--green-text); }

    .p-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 1.8s ease-in-out infinite;
      display: none;
    }
    .prayer-col.active .p-dot { display: block; }

    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .35; transform: scale(1.6); }
    }

    /* ══════════════════════════════════
       LOADING / ERROR overlays
    ══════════════════════════════════ */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8,20,10,0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 30;
      border-radius: var(--card-radius);
    }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { color: rgba(255,255,255,.78); font-size: 14px; }
    .retry-btn {
      background: var(--green);
      color: #fff; border: none;
      border-radius: 12px;
      padding: 10px 28px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity .2s;
    }
    .retry-btn:hover { opacity: .85; }
    .hidden { display: none !important; }

    /* ══════════════════════════════════
       METHOD MODAL (bottom sheet)
    ══════════════════════════════════ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 0 0;
      animation: fadeIn .2s;
    }
    .modal-backdrop.hidden { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-sheet {
      background: #fff;
      border-radius: 22px 22px 0 0;
      width: 100%; max-width: 480px;
      padding: 20px 20px 32px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }

    .modal-handle {
      width: 38px; height: 4px;
      background: #ddd; border-radius: 99px;
      margin: 0 auto 16px;
    }
    .modal-title {
      font-size: 15px; font-weight: 700;
      color: #333; text-align: center;
      margin-bottom: 16px;
    }
    .method-option {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s;
      font-size: 14px; color: #2a2a2a; font-weight: 600;
    }
    .method-option:hover { background: #f4f4f4; }
    .method-option.selected { background: var(--green-bg); color: var(--green-text); }
    .method-option .check {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid #ccc;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .method-option.selected .check {
      border-color: var(--green); background: var(--green);
    }
    .method-option.selected .check::after {
      content: '';
      width: 6px; height: 10px;
      border: 2px solid #fff;
      border-top: none; border-right: none; /* wrong */
      /* use a real checkmark */
      display: block;
      width: 5px; height: 9px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* ══════════════════════════════════
       DESKTOP SIDEBAR
    ══════════════════════════════════ */
    .sidebar-card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    .sidebar-card h3 {
      font-size: 13px;
      color: #666;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: .5px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; font-weight: 600; }
    .info-val { color: #222; font-weight: 700; }
    .info-val.green { color: var(--green-text); }

    .sidebar-next {
      background: linear-gradient(135deg, var(--green) 0%, #1a9e50 100%);
      border-radius: 16px;
      padding: 18px;
      color: #fff;
      text-align: center;
    }
    .sidebar-next .sn-label { font-size: 12px; opacity: .85; margin-bottom: 6px; }
    .sidebar-next .sn-name  { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
    .sidebar-next .sn-countdown { font-size: 32px; font-weight: 900; direction: ltr; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
    .sidebar-next .sn-sub  { font-size: 11px; opacity: .75; margin-top: 4px; }
  </style>
</head>
<body>

<!-- Method bottom-sheet modal -->
<div class="modal-backdrop hidden" id="methodModal" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">اختر طريقة الحساب</div>
    <div id="methodList"></div>
  </div>
</div>

<div class="page-root">

  <!-- ── Main card ── -->
  <div class="card" id="card">

    <!-- Loading -->
    <div class="overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span class="overlay-text" id="loadingText">جارِ تحديد موقعك …</span>
    </div>

    <!-- Error -->
    <div class="overlay hidden" id="errorOverlay">
      <span style="font-size:30px">⚠️</span>
      <span class="overlay-text" id="errorMsg">تعذّر تحميل مواقيت الصلاة</span>
      <button class="retry-btn" onclick="init()">إعادة المحاولة</button>
    </div>

    <!-- Hero -->
    <div class="hero">
      <div class="top-bar">
        <button class="method-btn" onclick="openModal()">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
          <span id="methodLabel">أم القرى</span>
        </button>
        <div class="hijri-chip">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="hijriDate">— هجري</span>
        </div>
      </div>

      <div class="hero-bottom">
        <!-- countdown (left side visually = ltr-start in rtl layout) -->
        <div class="countdown-side">
          <span class="countdown-label">باقي على الأذان</span>
          <div class="countdown" id="countdown">00 : 00 : 00</div>
        </div>
        <!-- prayer name + location (right side) -->
        <div class="prayer-side">
          <div class="location-row">
            <span class="location-text" id="locationText" onclick="init()">جارِ التحديد…</span>
            <span class="loc-pin">
              <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
            </span>
          </div>
          <div class="next-prayer-name" id="nextPrayerName">—</div>
        </div>
      </div>
    </div><!-- /hero -->

    <!-- Prayer columns -->
    <div class="prayer-list">
      <div class="prayers-row" id="prayerCols"></div>
    </div>

  </div><!-- /card -->

  <!-- ── Desktop sidebar ── -->
  <div class="sidebar">

    <div class="sidebar-card sidebar-next">
      <div class="sn-label">الصلاة القادمة</div>
      <div class="sn-name" id="sbNextName">—</div>
      <div class="sn-countdown" id="sbCountdown">00 : 00 : 00</div>
      <div class="sn-sub">باقي على الأذان</div>
    </div>

    <div class="sidebar-card">
      <h3>تفاصيل اليوم</h3>
      <div class="info-row">
        <span class="info-label">الشروق</span>
        <span class="info-val" id="sbSunrise">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">الغروب</span>
        <span class="info-val" id="sbSunset">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">منتصف الليل</span>
        <span class="info-val" id="sbMidnight">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">الصلاة الحالية</span>
        <span class="info-val green" id="sbCurrent">—</span>
      </div>
    </div>

    <div class="sidebar-card">
      <h3>جميع المواقيت</h3>
      <div id="sbAllPrayers"></div>
    </div>

  </div>

</div><!-- /page-root -->

<script>
/* ═══════════════════════════════════════
   Data
═══════════════════════════════════════ */
const PRAYERS = [
  { key: 'Fajr',    name: 'الفجر'  },
  { key: 'Dhuhr',   name: 'الظهر'  },
  { key: 'Asr',     name: 'العصر'  },
  { key: 'Maghrib', name: 'المغرب' },
  { key: 'Isha',    name: 'العشاء' },
];

const METHODS = [
  { id: 4,  label: 'أم القرى (السعودية)' },
  { id: 3,  label: 'مسلم عالمي' },
  { id: 2,  label: 'ISNA – أمريكا الشمالية' },
  { id: 1,  label: 'كراتشي – علوم إسلامية' },
  { id: 5,  label: 'مصر – وزارة الأوقاف' },
  { id: 9,  label: 'خليج عُمان' },
  { id: 11, label: 'فقه أمريكا الشمالية' },
];

let timings  = null;
let rawData  = null;
let timerIds = [];
let method   = 4;
let coords   = null;

/* ═══════════════════════════════════════
   Boot
═══════════════════════════════════════ */
buildMethodModal();

async function init() {
  setLoading('جارِ تحديد موقعك …');
  clearTimers();
  try {
    coords = await getCoords();
    await loadTimes(coords.lat, coords.lon, method);
    loadCity(coords.lat, coords.lon);   // non-blocking
  } catch (e) {
    setError(e.message || 'حدث خطأ غير متوقع');
  }
}
init();

/* ═══════════════════════════════════════
   Geolocation
═══════════════════════════════════════ */
function getCoords() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ lat: 21.3891, lon: 39.8579 }); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve({ lat: 21.3891, lon: 39.8579 }),
      { timeout: 9000 }
    );
  });
}

/* ═══════════════════════════════════════
   API – Aladhan
═══════════════════════════════════════ */
async function loadTimes(lat, lon, mth) {
  const d    = new Date();
  const date = `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
  const url  = `https://api.aladhan.com/v1/timings/${date}?latitude=${lat}&longitude=${lon}&method=${mth}`;

  const res  = await fetch(url);
  if (!res.ok) throw new Error('فشل الاتصال بخادم المواقيت');
  const json = await res.json();
  if (json.code !== 200) throw new Error('استجابة غير متوقعة من الخادم');

  rawData = json.data;
  timings = rawData.timings;

  const h = rawData.date.hijri;
  $('hijriDate').textContent = `${h.day} ${h.month.ar} ${h.year}`;

  render();
  hideOverlays();
  startTick();
}

/* ═══════════════════════════════════════
   Reverse geocoding – Nominatim
═══════════════════════════════════════ */
async function loadCity(lat, lon) {
  try {
    const res  = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
      { headers: { 'Accept-Language': 'ar' } }
    );
    const json = await res.json();
    const a    = json.address || {};
    const city = a.city || a.town || a.village || a.county || '';
    const cntry= a.country || '';
    $('locationText').textContent = city ? `${city}، ${cntry}` : cntry || 'موقعك الحالي';
  } catch {
    $('locationText').textContent = 'موقعك الحالي';
  }
}

/* ═══════════════════════════════════════
   Render
═══════════════════════════════════════ */
function render() {
  const curKey  = currentPrayerKey();
  const nextObj = nextPrayer();

  /* card prayer columns */
  const cols = $('prayerCols');
  cols.innerHTML = '';
  PRAYERS.forEach(p => {
    const active = p.key === curKey;
    const col = ce('div');
    col.className = 'prayer-col' + (active ? ' active' : '');
    col.innerHTML = `
      <span class="p-name">${p.name}</span>
      <span class="p-time">${fmt(timings[p.key])}</span>
      <div class="p-dot"></div>`;
    cols.appendChild(col);
  });

  /* next prayer label on hero */
  $('nextPrayerName').textContent = nextObj ? nextObj.name : PRAYERS[0].name;

  /* sidebar */
  $('sbNextName').textContent  = nextObj ? nextObj.name : PRAYERS[0].name;
  $('sbCurrent').textContent   = PRAYERS.find(p => p.key === curKey)?.name || '—';
  $('sbSunrise').textContent   = fmt(timings['Sunrise'] || '—');
  $('sbSunset').textContent    = fmt(timings['Sunset']  || '—');
  $('sbMidnight').textContent  = fmt(timings['Midnight']|| '—');

  const allDiv = $('sbAllPrayers');
  allDiv.innerHTML = '';
  PRAYERS.forEach(p => {
    const row = ce('div');
    row.className = 'info-row';
    const active = p.key === curKey;
    row.innerHTML = `
      <span class="info-label">${p.name}</span>
      <span class="info-val${active?' green':''}">${fmt(timings[p.key])}</span>`;
    allDiv.appendChild(row);
  });
}

/* ═══════════════════════════════════════
   Countdown tick
═══════════════════════════════════════ */
function startTick() { tick(); timerIds.push(setInterval(tick, 1000)); }

function tick() {
  const next = nextPrayer();
  if (!next) return;
  const diff = Math.max(0, Math.floor((prayerDate(next.key) - Date.now()) / 1000));
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  const str = `${pad(h)} : ${pad(m)} : ${pad(s)}`;
  $('countdown').textContent   = str;
  $('sbCountdown').textContent = str;
  if (s === 0) render();
}

/* ═══════════════════════════════════════
   Method modal
═══════════════════════════════════════ */
function buildMethodModal() {
  const list = $('methodList');
  list.innerHTML = '';
  METHODS.forEach(mt => {
    const el = ce('div');
    el.className = 'method-option' + (mt.id === method ? ' selected' : '');
    el.dataset.id = mt.id;
    el.innerHTML = `<span>${mt.label}</span><div class="check"></div>`;
    el.onclick = () => selectMethod(mt.id, mt.label);
    list.appendChild(el);
  });
}
function openModal()  { $('methodModal').classList.remove('hidden'); }
function closeModal(e){ if (e.target === $('methodModal')) $('methodModal').classList.add('hidden'); }
function selectMethod(id, label) {
  method = id;
  $('methodLabel').textContent = METHODS.find(m => m.id === id)?.label.split('–')[0].split('(')[0].trim() || label;
  buildMethodModal();
  $('methodModal').classList.add('hidden');
  if (coords) {
    setLoading('جارِ تحديث المواقيت …');
    clearTimers();
    loadTimes(coords.lat, coords.lon, method).catch(e => setError(e.message));
  }
}

/* ═══════════════════════════════════════
   Helpers
═══════════════════════════════════════ */
function nextPrayer() {
  const now = Date.now();
  for (const p of PRAYERS) { if (prayerDate(p.key) > now) return p; }
  return PRAYERS[0];
}
function currentPrayerKey() {
  const now  = Date.now();
  let   last = PRAYERS[PRAYERS.length - 1];
  for (let i = PRAYERS.length - 1; i >= 0; i--) {
    if (prayerDate(PRAYERS[i].key) <= now) { last = PRAYERS[i]; break; }
  }
  return last.key;
}
function prayerDate(key) {
  if (!timings || !timings[key]) return new Date(0);
  const [h, m] = timings[key].split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0); return d;
}
function fmt(raw) {
  if (!raw || raw === '—') return '—';
  const parts = raw.split(':');
  if (parts.length < 2) return raw;
  const h = parseInt(parts[0], 10);
  const m = parts[1];
  return `${pad(h % 12 || 12)}:${m} ${h < 12 ? 'ص' : 'م'}`;
}
function pad(n) { return String(n).padStart(2, '0'); }
function clearTimers() { timerIds.forEach(clearInterval); timerIds = []; }
function $(id) { return document.getElementById(id); }
function ce(tag) { return document.createElement(tag); }

function setLoading(msg) {
  $('loadingText').textContent = msg;
  $('loadingOverlay').classList.remove('hidden');
  $('errorOverlay').classList.add('hidden');
}
function setError(msg) {
  $('errorMsg').textContent = msg;
  $('errorOverlay').classList.remove('hidden');
  $('loadingOverlay').classList.add('hidden');
}
function hideOverlays() {
  $('loadingOverlay').classList.add('hidden');
  $('errorOverlay').classList.add('hidden');
}
</script>
