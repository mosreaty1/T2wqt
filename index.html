<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مواقيت الصلاة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #27ae60;
      --green-bg:   #eaf7ef;
      --green-text: #1e8449;
      --radius:     24px;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #b8ceb0;
      background-image:
        radial-gradient(ellipse at 15% 55%, rgba(160,200,140,.7) 0%, transparent 58%),
        radial-gradient(ellipse at 85% 15%, rgba(190,215,170,.5) 0%, transparent 55%);
    }

    /* ── Desktop 2-column layout ── */
    @media (min-width: 900px) {
      body { align-items: flex-start; padding: 40px 20px; }
      .page-root {
        display: grid;
        grid-template-columns: 440px 1fr;
        gap: 28px;
        width: 100%;
        max-width: 920px;
        align-items: start;
      }
      .sidebar { display: flex; flex-direction: column; gap: 18px; }
    }
    @media (max-width: 899px) {
      .sidebar    { display: none; }
      .page-root  { max-width: 440px; width: 100%; }
    }

    /* ══════════════════════════════════
       CARD
    ══════════════════════════════════ */
    .card {
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.1);
      position: relative;
      background: #fff;
    }

    /* ══════════════════════════════════
       HERO – cross-fade image gallery
    ══════════════════════════════════ */
    .hero {
      position: relative;
      height: 280px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    .hero:active { cursor: grabbing; }
    @media (min-width: 900px) { .hero { height: 310px; } }

    /* Two stacked bg layers for cross-fade */
    .hero-bg {
      position: absolute; inset: 0;
      background: #1a2a1a center / cover no-repeat;
      opacity: 0;
      transition: opacity .65s ease;
    }
    .hero-bg.show { opacity: 1; }

    /* gradient overlay (always on top of bg layers) */
    .hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.06) 0%,
        rgba(0,0,0,.04) 40%,
        rgba(0,0,0,.62) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── top bar ── */
    .top-bar {
      position: absolute;
      top: 14px; right: 14px; left: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    /* Hijri date chip (dark glass) */
    .glass-chip {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,.38);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 5px 13px;
      color: rgba(255,255,255,.9);
      font-size: 11px; font-weight: 600;
      white-space: nowrap;
      border: none; font-family: 'Cairo', sans-serif;
      cursor: default;
    }

    /* Method chip – always shows selected state (green pill) */
    .method-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-radius: 999px;
      padding: 5px 6px 5px 14px;
      border: none;
      font-family: 'Cairo', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--green-text);
      white-space: nowrap;
      cursor: pointer;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    .method-chip:hover {
      background: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .method-chip-label { flex: 1; }
    .method-chip-check {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--green);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(39,174,96,.35);
    }

    /* ── gallery dots ── */
    .gallery-dots {
      position: absolute;
      top: 50px; left: 14px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .g-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      cursor: pointer;
      transition: background .2s, transform .2s;
      border: 1px solid rgba(255,255,255,.2);
    }
    .g-dot.active {
      background: #fff;
      transform: scale(1.25);
      box-shadow: 0 0 6px rgba(255,255,255,.6);
    }
    /* ── left/right arrows (desktop hover) ── */
    .hero-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      z-index: 3;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0; transition: opacity .2s;
    }
    .hero:hover .hero-arrow { opacity: 1; }
    .hero-arrow.prev { right: 14px; }
    .hero-arrow.next { left:  14px; }

    /* ── hero bottom split ── */
    .hero-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 20px;
      gap: 8px;
    }

    /* countdown (left) */
    .countdown-side { display: flex; flex-direction: column; align-items: flex-start; }
    .countdown-label {
      color: rgba(255,255,255,.82);
      font-size: 11px; font-weight: 600;
      letter-spacing: .5px; margin-bottom: 2px;
    }
    .countdown {
      color: #fff;
      font-size: clamp(24px, 7vw, 36px);
      font-weight: 900;
      direction: ltr;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px; line-height: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    /* prayer name + location (right) */
    .prayer-side { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .location-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
    .location-text {
      color: rgba(255,255,255,.88);
      font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 165px;
    }
    .location-text:hover { opacity: .7; }
    .loc-pin { color: rgba(255,255,255,.75); flex-shrink: 0; }

    .next-prayer-name {
      color: #fff;
      font-size: clamp(28px, 9vw, 46px);
      font-weight: 900; line-height: 1;
      text-shadow: 0 2px 14px rgba(0,0,0,.35);
    }

    /* ── bg label (image name) ── */
    .bg-label {
      position: absolute;
      bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 3;
      background: rgba(0,0,0,.32);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 3px 10px;
      color: rgba(255,255,255,.75);
      font-size: 10px; white-space: nowrap;
      pointer-events: none;
      opacity: 0; transition: opacity .4s;
    }
    .bg-label.show { opacity: 1; }

    /* ══════════════════════════════════
       PRAYER LIST
    ══════════════════════════════════ */
    .prayer-list {
      background: #fff;
      padding: 16px 14px 20px;
    }
    .prayers-row {
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      gap: 4px;
    }
    .prayer-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      padding: 10px 6px 12px;
      border-radius: 14px;
      transition: background .25s;
    }
    .prayer-col.active { background: var(--green-bg); }

    .p-name {
      font-size: 12px; color: #b0b8b4; font-weight: 700;
      white-space: nowrap;
    }
    .prayer-col.active .p-name { color: var(--green-text); }

    .p-time {
      font-size: clamp(13px, 3.5vw, 16px);
      font-weight: 700; color: #1c2a22;
      direction: ltr; white-space: nowrap;
    }
    .prayer-col.active .p-time { color: var(--green-text); }

    .p-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 1.8s ease-in-out infinite;
      display: none;
    }
    .prayer-col.active .p-dot { display: block; }

    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .3; transform: scale(1.7); }
    }

    /* ══════════════════════════════════
       OVERLAYS
    ══════════════════════════════════ */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(8,20,10,.88);
      backdrop-filter: blur(4px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 30;
      border-radius: var(--radius);
    }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { color: rgba(255,255,255,.78); font-size: 14px; }
    .retry-btn {
      background: var(--green); color: #fff; border: none;
      border-radius: 12px; padding: 10px 28px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 4px; transition: opacity .2s;
    }
    .retry-btn:hover { opacity: .85; }
    .hidden { display: none !important; }

    /* ══════════════════════════════════
       METHOD BOTTOM-SHEET
    ══════════════════════════════════ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn .2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      background: #fff;
      border-radius: 22px 22px 0 0;
      width: 100%; max-width: 480px;
      padding: 20px 20px 36px;
      animation: slideUp .25s ease;
      max-height: 80vh; overflow-y: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .modal-handle {
      width: 38px; height: 4px;
      background: #ddd; border-radius: 99px;
      margin: 0 auto 16px;
    }
    .modal-title {
      font-size: 15px; font-weight: 700;
      color: #333; text-align: center; margin-bottom: 14px;
    }
    .method-option {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-radius: 12px;
      cursor: pointer; transition: background .15s;
      font-size: 14px; color: #2a2a2a; font-weight: 600;
    }
    .method-option:hover { background: #f4f4f4; }
    .method-option.selected { background: var(--green-bg); color: var(--green-text); }
    .check-circle {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #ccc;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .method-option.selected .check-circle {
      background: var(--green); border-color: var(--green);
    }
    .method-option.selected .check-circle::after {
      content: '';
      display: block; width: 5px; height: 9px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg) translate(-1px,-1px);
    }

    /* ══════════════════════════════════
       DESKTOP SIDEBAR
    ══════════════════════════════════ */
    .sb-card {
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    .sb-card h3 {
      font-size: 12px; color: #888;
      font-weight: 700; letter-spacing: .5px;
      margin-bottom: 12px;
    }
    .sb-next {
      background: linear-gradient(135deg, var(--green) 0%, #1a9e50 100%);
      border-radius: 18px; padding: 18px;
      color: #fff; text-align: center;
    }
    .sb-next .n-label  { font-size: 11px; opacity: .82; margin-bottom: 5px; }
    .sb-next .n-name   { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
    .sb-next .n-cd     { font-size: 30px; font-weight: 900; direction: ltr; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
    .sb-next .n-sub    { font-size: 11px; opacity: .7; margin-top: 4px; }

    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,.06);
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .i-label { color: #888; font-weight: 600; }
    .i-val   { color: #222; font-weight: 700; }
    .i-val.green { color: var(--green-text); }
  </style>
</head>
<body>

<!-- Method modal -->
<div class="modal-backdrop hidden" id="methodModal" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">اختر طريقة الحساب</div>
    <div id="methodList"></div>
  </div>
</div>

<div class="page-root">

  <!-- ── Main card ── -->
  <div class="card" id="card">

    <!-- overlays -->
    <div class="overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span class="overlay-text" id="loadingText">جارِ تحديد موقعك…</span>
    </div>
    <div class="overlay hidden" id="errorOverlay">
      <span style="font-size:30px">⚠️</span>
      <span class="overlay-text" id="errorMsg">تعذّر تحميل مواقيت الصلاة</span>
      <button class="retry-btn" onclick="init()">إعادة المحاولة</button>
    </div>

    <!-- ── Hero ── -->
    <div class="hero" id="hero">
      <!-- cross-fade bg layers -->
      <div class="hero-bg" id="bgA"></div>
      <div class="hero-bg" id="bgB"></div>
      <!-- gradient overlay -->
      <div class="hero-grad"></div>

      <!-- top bar -->
      <div class="top-bar">
        <button class="method-chip" onclick="openModal()">
          <span class="method-chip-label" id="methodLabel">أم القرى</span>
          <div class="method-chip-check">
            <!-- white checkmark -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="#fff" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </button>
        <div class="glass-chip" id="hijriDate">— هجري</div>
      </div>

      <!-- gallery dot nav (vertical, left side) -->
      <div class="gallery-dots" id="galleryDots"></div>

      <!-- arrows (desktop) -->
      <button class="hero-arrow prev" onclick="shiftBg(1)"  aria-label="next">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="hero-arrow next" onclick="shiftBg(-1)" aria-label="prev">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <!-- image name label -->
      <div class="bg-label" id="bgLabel"></div>

      <!-- bottom split -->
      <div class="hero-bottom">
        <div class="countdown-side">
          <span class="countdown-label">باقي على الأذان</span>
          <div class="countdown" id="countdown">00 : 00 : 00</div>
        </div>
        <div class="prayer-side">
          <div class="location-row">
            <span class="location-text" id="locationText" onclick="init()">جارِ التحديد…</span>
            <span class="loc-pin">
              <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
            </span>
          </div>
          <div class="next-prayer-name" id="nextPrayerName">—</div>
        </div>
      </div>
    </div><!-- /hero -->

    <!-- prayer list -->
    <div class="prayer-list">
      <div class="prayers-row" id="prayerCols"></div>
    </div>

  </div><!-- /card -->

  <!-- ── Desktop sidebar ── -->
  <div class="sidebar">
    <div class="sb-next sb-card">
      <div class="n-label">الصلاة القادمة</div>
      <div class="n-name" id="sbNextName">—</div>
      <div class="n-cd"   id="sbCountdown">00 : 00 : 00</div>
      <div class="n-sub">باقي على الأذان</div>
    </div>

    <div class="sb-card">
      <h3>تفاصيل اليوم</h3>
      <div class="info-row"><span class="i-label">الشروق</span>   <span class="i-val" id="sbSunrise">—</span></div>
      <div class="info-row"><span class="i-label">الغروب</span>   <span class="i-val" id="sbSunset">—</span></div>
      <div class="info-row"><span class="i-label">منتصف الليل</span><span class="i-val" id="sbMidnight">—</span></div>
      <div class="info-row"><span class="i-label">الصلاة الحالية</span><span class="i-val green" id="sbCurrent">—</span></div>
    </div>

    <div class="sb-card">
      <h3>جميع المواقيت</h3>
      <div id="sbAllPrayers"></div>
    </div>
  </div>

</div><!-- /page-root -->

<script>
/* ═══════════════════════════════════════════════
   MOSQUE BACKGROUND GALLERY
   All images verified as real Islamic mosque
   exterior photos from Pexels (free license,
   HTTP 200 confirmed before deployment).
═══════════════════════════════════════════════ */
const MOSQUE_IMAGES = [
  {
    id:    '33687823',
    label: 'مسجد الشيخ زايد، أبوظبي',
    /* Sheikh Zayed Grand Mosque at Twilight Reflection – Lloyd Alozie */
  },
  {
    id:    '1631676',
    label: 'صلاة الغروب',
    /* Silhouette of Mosque during Sunset – Abdullah Ghatasheh */
  },
  {
    id:    '16737017',
    label: 'مساجد إسطنبول',
    /* Mosque Silhouette in Istanbul at Sunset – Kaan ALTUN */
  },
  {
    id:    '28669652',
    label: 'مسجد الحاكم، القاهرة',
    /* Stunning Evening View of Al-Hakim Mosque in Cairo – Mohamed samir */
  },
  {
    id:    '6099936',
    label: 'المسجد النبوي، المدينة المنورة',
    /* Al-Masjid an-Nabawi (Prophet's Mosque) courtyard – jepret hikmah */
  },
  {
    id:    '14440333',
    label: 'المسجد الحرام، مكة المكرمة',
    /* Landscape Photography of Masjid al-Haram – Talal Hakim */
  },
  {
    id:    '2344997',
    label: 'جامع دلهي عند الغروب',
    /* View of Jama Masjid at Sunset, New Delhi – Fuzail Ahmad */
  },
  {
    id:    '7805386',
    label: 'أفق إسطنبول',
    /* Mosque Silhouette at Sunset, Istanbul skyline */
  },
];

function bgUrl(id) {
  return `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=900&h=580&dpr=1`;
}

/* active bg layer & index */
let bgIdx   = 0;
let bgLayer = 'A';          // 'A' or 'B'
const bgA   = document.getElementById('bgA');
const bgB   = document.getElementById('bgB');
let   bgLabelTimer = null;

/* Preload an image then cross-fade */
function setBg(idx, showLabel = false) {
  bgIdx = ((idx % MOSQUE_IMAGES.length) + MOSQUE_IMAGES.length) % MOSQUE_IMAGES.length;
  const url  = bgUrl(MOSQUE_IMAGES[bgIdx].id);
  const next = bgLayer === 'A' ? bgB : bgA;
  const curr = bgLayer === 'A' ? bgA : bgB;

  const img = new Image();
  img.onload = () => {
    next.style.backgroundImage = `url(${url})`;
    next.classList.add('show');
    curr.classList.remove('show');
    bgLayer = bgLayer === 'A' ? 'B' : 'A';
    renderDots();

    if (showLabel) {
      const lbl = document.getElementById('bgLabel');
      lbl.textContent = MOSQUE_IMAGES[bgIdx].label;
      lbl.classList.add('show');
      clearTimeout(bgLabelTimer);
      bgLabelTimer = setTimeout(() => lbl.classList.remove('show'), 2000);
    }
  };
  img.onerror = () => {
    /* skip broken image silently */
    shiftBg(1, showLabel);
  };
  img.src = url;
}

function shiftBg(dir = 1, showLabel = true) {
  setBg(bgIdx + dir, showLabel);
}

function renderDots() {
  const container = document.getElementById('galleryDots');
  container.innerHTML = '';
  MOSQUE_IMAGES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'g-dot' + (i === bgIdx ? ' active' : '');
    d.onclick = () => setBg(i, true);
    container.appendChild(d);
  });
}

/* Touch swipe on hero */
let swipeX = 0;
const hero = document.getElementById('hero');
hero.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive: true });
hero.addEventListener('touchend',   e => {
  const dx = swipeX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 45) shiftBg(dx > 0 ? 1 : -1, true);
}, { passive: true });

/* Auto-advance every 12 s */
setInterval(() => shiftBg(1, false), 12000);

/* Init gallery */
renderDots();
setBg(0, false);   /* load first image */

/* ═══════════════════════════════════════════════
   PRAYER TIMES DATA
═══════════════════════════════════════════════ */
const PRAYERS = [
  { key: 'Fajr',    name: 'الفجر'  },
  { key: 'Dhuhr',   name: 'الظهر'  },
  { key: 'Asr',     name: 'العصر'  },
  { key: 'Maghrib', name: 'المغرب' },
  { key: 'Isha',    name: 'العشاء' },
];
const METHODS = [
  { id: 4,  label: 'أم القرى (السعودية)',       short: 'أم القرى' },
  { id: 3,  label: 'مسلم عالمي',               short: 'مسلم عالمي' },
  { id: 2,  label: 'ISNA – أمريكا الشمالية',   short: 'ISNA' },
  { id: 1,  label: 'كراتشي – علوم إسلامية',    short: 'كراتشي' },
  { id: 5,  label: 'مصر – وزارة الأوقاف',      short: 'مصر' },
  { id: 9,  label: 'خليج عُمان',               short: 'خليج عُمان' },
  { id: 11, label: 'فقه أمريكا الشمالية',       short: 'فقه أمريكا' },
];

let timings  = null;
let timerIds = [];
let method   = 4;
let coords   = null;

buildMethodModal();
init();

async function init() {
  setLoading('جارِ تحديد موقعك…');
  clearTimers();
  try {
    coords = await getCoords();
    await loadTimes(coords.lat, coords.lon, method);
    loadCity(coords.lat, coords.lon);   // non-blocking
  } catch (e) {
    setError(e.message || 'حدث خطأ غير متوقع');
  }
}

/* ── Geolocation ── */
function getCoords() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ lat: 21.3891, lon: 39.8579 }); return; }
    navigator.geolocation.getCurrentPosition(
      p  => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve({ lat: 21.3891, lon: 39.8579 }),
      { timeout: 9000 }
    );
  });
}

/* ── Aladhan API ── */
async function loadTimes(lat, lon, mth) {
  const d    = new Date();
  const date = `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
  const res  = await fetch(
    `https://api.aladhan.com/v1/timings/${date}?latitude=${lat}&longitude=${lon}&method=${mth}`
  );
  if (!res.ok) throw new Error('فشل الاتصال بخادم المواقيت');
  const json = await res.json();
  if (json.code !== 200) throw new Error('استجابة غير متوقعة من الخادم');

  timings = json.data.timings;
  const h = json.data.date.hijri;
  $('hijriDate').textContent = `${h.day} ${h.month.ar} ${h.year}`;

  render();
  hideOverlays();
  startTick();
}

/* ── Nominatim ── */
async function loadCity(lat, lon) {
  try {
    const res  = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
      { headers: { 'Accept-Language': 'ar' } }
    );
    const json = await res.json();
    const a    = json.address || {};
    const city = a.city || a.town || a.village || a.county || '';
    $('locationText').textContent = city
      ? `${city}، ${a.country || ''}`
      : (a.country || 'موقعك الحالي');
  } catch {
    $('locationText').textContent = 'موقعك الحالي';
  }
}

/* ── Render ── */
function render() {
  const curKey = currentKey();
  const nextP  = nextPrayer();

  /* columns */
  const cols = $('prayerCols');
  cols.innerHTML = '';
  PRAYERS.forEach(p => {
    const active = p.key === curKey;
    const col    = document.createElement('div');
    col.className = 'prayer-col' + (active ? ' active' : '');
    col.innerHTML = `
      <span class="p-name">${p.name}</span>
      <span class="p-time">${fmt(timings[p.key])}</span>
      <div class="p-dot"></div>`;
    cols.appendChild(col);
  });

  /* hero next prayer */
  $('nextPrayerName').textContent = nextP ? nextP.name : PRAYERS[0].name;

  /* sidebar */
  $('sbNextName').textContent  = nextP ? nextP.name : PRAYERS[0].name;
  $('sbCurrent').textContent   = PRAYERS.find(p => p.key === curKey)?.name || '—';
  $('sbSunrise').textContent   = fmt(timings['Sunrise']  || '—');
  $('sbSunset').textContent    = fmt(timings['Sunset']   || '—');
  $('sbMidnight').textContent  = fmt(timings['Midnight'] || '—');

  const allDiv = $('sbAllPrayers');
  allDiv.innerHTML = '';
  PRAYERS.forEach(p => {
    const row    = document.createElement('div');
    const active = p.key === curKey;
    row.className = 'info-row';
    row.innerHTML = `
      <span class="i-label">${p.name}</span>
      <span class="i-val${active?' green':''}">${fmt(timings[p.key])}</span>`;
    allDiv.appendChild(row);
  });
}

/* ── Countdown ── */
function startTick() { tick(); timerIds.push(setInterval(tick, 1000)); }

function tick() {
  const next = nextPrayer();
  if (!next) return;
  const diff = Math.max(0, Math.floor((prayerDate(next.key) - Date.now()) / 1000));
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  const str = `${pad(h)} : ${pad(m)} : ${pad(s)}`;
  $('countdown').textContent   = str;
  $('sbCountdown').textContent = str;
  if (s === 0 && m === 0) render();
}

/* ── Method modal ── */
function buildMethodModal() {
  const list = $('methodList');
  list.innerHTML = '';
  METHODS.forEach(mt => {
    const el = document.createElement('div');
    el.className = 'method-option' + (mt.id === method ? ' selected' : '');
    el.innerHTML = `<span>${mt.label}</span><div class="check-circle"></div>`;
    el.onclick   = () => selectMethod(mt.id, mt.short);
    list.appendChild(el);
  });
}
function openModal()  { $('methodModal').classList.remove('hidden'); }
function closeModal(e){ if (e.target === $('methodModal')) $('methodModal').classList.add('hidden'); }
function selectMethod(id, short) {
  method = id;
  $('methodLabel').textContent = short;
  buildMethodModal();
  $('methodModal').classList.add('hidden');
  if (coords) {
    setLoading('جارِ تحديث المواقيت…');
    clearTimers();
    loadTimes(coords.lat, coords.lon, method).catch(e => setError(e.message));
  }
}

/* ── Helpers ── */
function nextPrayer() {
  const now = Date.now();
  for (const p of PRAYERS) { if (prayerDate(p.key) > now) return p; }
  return PRAYERS[0];
}
function currentKey() {
  const now  = Date.now();
  let   last = PRAYERS[PRAYERS.length - 1];
  for (let i = PRAYERS.length - 1; i >= 0; i--) {
    if (prayerDate(PRAYERS[i].key) <= now) { last = PRAYERS[i]; break; }
  }
  return last.key;
}
function prayerDate(key) {
  if (!timings?.[key]) return new Date(0);
  const [h, m] = timings[key].split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0); return d;
}
function fmt(raw) {
  if (!raw || raw === '—') return '—';
  const p = raw.split(':');
  if (p.length < 2) return raw;
  const h = parseInt(p[0], 10);
  return `${pad(h % 12 || 12)}:${p[1]} ${h < 12 ? 'ص' : 'م'}`;
}
function pad(n)  { return String(n).padStart(2, '0'); }
function clearTimers() { timerIds.forEach(clearInterval); timerIds = []; }
function $(id)   { return document.getElementById(id); }

function setLoading(msg) {
  $('loadingText').textContent = msg;
  $('loadingOverlay').classList.remove('hidden');
  $('errorOverlay').classList.add('hidden');
}
function setError(msg) {
  $('errorMsg').textContent = msg;
  $('errorOverlay').classList.remove('hidden');
  $('loadingOverlay').classList.add('hidden');
}
function hideOverlays() {
  $('loadingOverlay').classList.add('hidden');
  $('errorOverlay').classList.add('hidden');
}
</script>
